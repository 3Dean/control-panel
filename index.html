<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="panel" aria-label="Control panel">
      <div class="screen">
        <div class="amount" id="amountDisplay">$1,000.00</div>
      </div>

      <div class="control-grid">
        <div class="knob-group knob-group--left">
          <button class="knob" data-control="rebalance" aria-label="Rebalancing Interval"></button>
          <div class="knob-label">Rebalancing Interval</div>
          <button class="knob" data-control="ai" aria-label="AI Confidence"></button>
          <div class="knob-label">AI Confidence</div>
          <button class="knob" data-control="paramC" aria-label="Parameter C"></button>
          <div class="knob-label">Parameter C</div>
        </div>

        <div class="middle-controls">
          <div class="mode-tag mode-tag--bull" id="modeBull">BULL</div>
          <button class="toggle" id="modeToggle" aria-label="Bull/Bear switch" aria-pressed="false">
            <img src="images/handle_up.png" alt="Bull/Bear switch" />
          </button>
          <div class="mode-tag mode-tag--bear" id="modeBear">BEAR</div>
          <button class="led" id="ledButton" aria-label="Status indicator" aria-pressed="false">
            <img src="images/light_off.png" alt="Status LED" class="led-img" />
          </button>
        </div>

        <div class="knob-group knob-group--right">
          <button class="knob" data-control="sector" aria-label="Sector Weighting"></button>
          <div class="knob-label">Sector Weighting</div>
          <button class="knob" data-control="takeProfit" aria-label="Take Profit"></button>
          <div class="knob-label">Take Profit</div>
          <button class="knob" data-control="paramF" aria-label="Parameter F"></button>
          <div class="knob-label">Parameter F</div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button type="button" id="modalClose" aria-label="Close dialog">×</button>
      </div>
      <form id="modalForm">
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const state = {
      mode: 'bull',
      amount: 1000,
      values: {
        rebalance: 7,
        sector: 'Even-weighted portfolio',
        ai: 72,
        takeProfit: 15,
        paramC: 'Medium',
        paramF: 'Standard'
      }
    };

    const controlsConfig = {
      rebalance: { title: 'Rebalancing Interval', type: 'range', min: 1, max: 30, step: 1, unit: 'days' },
      sector: { title: 'Sector Weighting', type: 'textarea', placeholder: 'e.g. Tech 30%, Energy 15%, Financials 20%' },
      ai: { title: 'AI Confidence', type: 'range', min: 0, max: 100, step: 1, unit: '%' },
      takeProfit: { title: 'Take Profit', type: 'number', min: 1, max: 100, step: 0.5, unit: '%' },
      paramC: { title: 'Parameter C', type: 'text', placeholder: 'Describe Parameter C' },
      paramF: { title: 'Parameter F', type: 'text', placeholder: 'Describe Parameter F' }
    };

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalForm = document.getElementById('modalForm');
    const modalClose = document.getElementById('modalClose');
    const modalCancel = document.getElementById('modalCancel');
    const modeToggle = document.getElementById('modeToggle');
    const ledButton = document.getElementById('ledButton');
    const amountDisplay = document.getElementById('amountDisplay');
    let activeControl = null;

    function updateAmountDisplay() {
      amountDisplay.textContent = state.amount.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
    }

    function updateModeUi() {
      const isBull = state.mode === 'bull';
      modeToggle.setAttribute('aria-pressed', String(!isBull));
      document.getElementById('modeBull').style.opacity = isBull ? '1' : '0.4';
      document.getElementById('modeBear').style.opacity = isBull ? '0.4' : '1';
      const handleSrc = isBull ? 'images/handle_up.png' : 'images/handle_down.png';
      modeToggle.querySelector('img').setAttribute('src', handleSrc);
      ledButton.classList.toggle('active', !isBull);
      ledButton.setAttribute('aria-pressed', String(!isBull));
      ledButton.querySelector('img').setAttribute('src', !isBull ? 'images/light_on.png' : 'images/light_off.png');
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
      activeControl = null;
    }

    function openModal(controlKey) {
      const config = controlsConfig[controlKey];
      activeControl = controlKey;
      modalTitle.textContent = config.title;

      const value = state.values[controlKey];
      let fieldHtml = '';
      if (config.type === 'range') {
        fieldHtml = `
          <div class="field">
            <label for="control-input">${config.title}</label>
            <input type="range" id="control-input" name="control" min="${config.min}" max="${config.max}" step="${config.step}" value="${value}" />
            <div class="range-value" id="rangeValue">${value}${config.unit || ''}</div>
          </div>`;
      } else if (config.type === 'number') {
        fieldHtml = `
          <div class="field">
            <label for="control-input">${config.title}</label>
            <input type="number" id="control-input" name="control" min="${config.min}" max="${config.max}" step="${config.step}" value="${value}" />
          </div>`;
      } else if (config.type === 'textarea') {
        fieldHtml = `
          <div class="field">
            <label for="control-input">${config.title}</label>
            <textarea id="control-input" name="control" rows="4" placeholder="${config.placeholder || ''}">${value}</textarea>
          </div>`;
      } else {
        fieldHtml = `
          <div class="field">
            <label for="control-input">${config.title}</label>
            <input type="text" id="control-input" name="control" value="${value}" placeholder="${config.placeholder || ''}" />
          </div>`;
      }
      modalBody.innerHTML = fieldHtml;
      modalOverlay.classList.remove('hidden');
      const inputEl = document.getElementById('control-input');
      inputEl.focus();
      if (config.type === 'range') {
        inputEl.addEventListener('input', () => {
          document.getElementById('rangeValue').textContent = `${inputEl.value}${config.unit || ''}`;
        });
      }
    }

    document.querySelectorAll('[data-control]').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.control));
    });

    modeToggle.addEventListener('click', () => {
      state.mode = state.mode === 'bull' ? 'bear' : 'bull';
      updateModeUi();
    });

    ledButton.addEventListener('click', () => {
      state.mode = state.mode === 'bull' ? 'bear' : 'bull';
      updateModeUi();
    });

    modalClose.addEventListener('click', closeModal);
    modalCancel.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    modalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!activeControl) return;
      const config = controlsConfig[activeControl];
      const input = document.getElementById('control-input');
      let newVal = input.value;
      if (config.type === 'range' || config.type === 'number') {
        newVal = Number(newVal);
      }
      state.values[activeControl] = newVal;
      closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) {
        closeModal();
      }
    });

    updateAmountDisplay();
    updateModeUi();
  </script>
</body>
</html>
